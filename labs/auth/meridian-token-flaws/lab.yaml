description: >-
  A small banking-style customer portal with two unrelated authentication
  bugs — one in how password resets are proven, one in how sessions are
  verified. Neither depends on the other.

objectives:
  - id: "predictable-reset-token"
    title: "Take over another customer's account via password reset"
    description: >-
      The reset flow gives you a token for your own account. Look closely
      at what that token actually contains before assuming it's random.
    flag: "0xBugLabs{pr3d1ct4bl3_r3s3t_t0k3n_4cc0unt_t4k30v3r}"

  - id: "jwt-alg-none"
    title: "Reach the admin console without admin credentials"
    description: >-
      Sessions here are JWTs. You'll never see the signing secret — you're
      not meant to need it.
    flag: "0xBugLabs{jwt_4lg_n0n3_4uth_byp4ss}"

