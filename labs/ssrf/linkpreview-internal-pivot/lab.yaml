title: "LinkPreview — pivoting into the internal network"
slug: "linkpreview-internal-pivot"
category: "SSRF"
difficulty: "Medium"
tech: ["Node.js", "Express", "Docker Compose (2 services)"]
port: 8082

description: >-
  A link-unfurling feature — paste a URL, get a snippet back, the same
  category of feature that generates most real-world SSRF reports. Behind
  it sits a small internal network you were never given direct access to.

objectives:
  - id: "reach-internal-service"
    title: "Reach a service that isn't exposed to you at all"
    description: >-
      There's more than one container in this lab. One of them has no
      published port — nothing you can curl directly. Find a way to make
      the app you *do* have access to fetch it on your behalf.
    flag: "0xBugLabs{ssrf_r34ch3d_th3_1nt3rn4l_n3tw0rk}"

  - id: "pivot-to-hidden-endpoint"
    title: "Find what that internal service doesn't advertise"
    description: >-
      Reaching the internal service once isn't the finish line. It has more
      than one route, and only one of them is the obvious one.
    flag: "0xBugLabs{ssrf_p1v0t_t0_hidd3n_3ndp0int}"

