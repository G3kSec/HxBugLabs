title: "Acme HelpDesk — ticket access control"
slug: "helpdesk-ticket-access"
category: "Access Control / IDOR"
difficulty: "Easy"
tech: ["Node.js", "Express", "EJS"]
port: 8080

description: >-
  A small internal support-ticket portal for Acme Corp customers. You're
  given a low-privilege customer account — everything else you find is
  yours to discover, the same way you'd approach an in-scope target with a
  test account on a real program.

objectives:
  - id: "read-foreign-ticket"
    title: "Read another customer's ticket"
    description: >-
      Every ticket you're supposed to see belongs to your own account.
      Find a way to read one that doesn't.
    flag: "0xBugLabs{h0riz0nt4l_1d0r_1s_st1ll_a_bug}"
    hints:
      - "Open one of your own tickets and look at the URL. What identifies which ticket you're viewing?"
      - "The ticket ID is sequential and the app trusts whatever ID you give it — it never checks that the ticket actually belongs to you."

  - id: "reach-agent-console"
    title: "Reach the internal agent console"
    description: >-
      There's a staff-only view of the support queue. Your account is a
      regular customer, not staff.
    flag: "0xBugLabs{v3rt1c4l_4cc3ss_c0ntr0l_m1ss1ng}"
    hints:
      - "The customer UI never links to a staff area. That doesn't mean the route isn't there."
      - "Try common staff paths directly in the URL bar while logged in as a regular customer."

tags:
  - "idor"
  - "broken-access-control"
  - "horizontal-privilege-escalation"
  - "missing-function-level-access-control"
