services:
  noteshare:
    build: .
    container_name: 0xbuglabs-noteshare-admin-bot
    ports:
      - "8081:8081"
    restart: unless-stopped
    # bot.js launches Chromium with --no-sandbox instead of granting this
    # container SYS_ADMIN (the other common fix for "Chrome won't start in
    # a container") — no-sandbox is the less-privileged of the two, and
    # the alternative isn't needed once you've picked one.
