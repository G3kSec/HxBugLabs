title: "NoteShare — from reflected XSS to admin takeover"
slug: "noteshare-admin-bot"
category: "XSS"
difficulty: "Medium"
tech: ["Node.js", "Express", "EJS", "Puppeteer"]
port: 8081

description: >-
  A shared-notes app with a real support workflow: report a broken link and
  a support bot reviews it in a real browser, logged in as an admin. What
  you do with that is up to you.

objectives:
  - id: "reflected-xss"
    title: "Get real script execution via the search box"
    description: >-
      The search results page isn't as careful with your query as it
      should be. Prove you can run arbitrary JavaScript in your own
      session — not just get unescaped text in the response.
    flag: "0xBugLabs{r3fl3ct3d_xss_r34l_ex3cut10n}"

  - id: "admin-session-theft"
    title: "Take over the admin account"
    description: >-
      The support bot visits reported links as an actual logged-in admin,
      in a real browser. Turn a note into something that steals what
      that session is worth, then use it.
    flag: "0xBugLabs{st0l3n_s3ss10n_c00k13_4cc0unt_t4k30v3r}"

tags:
  - "xss"
  - "reflected-xss"
  - "stored-xss"
  - "session-hijacking"
  - "admin-bot"
