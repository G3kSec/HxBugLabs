# HxBugLabs — closed taxonomy.
#
# Same discipline as HxBugLetter: these lists are the single source of
# truth for scripts/validate.py and web/src/lib/types.ts. Closed on
# purpose — if every lab invents its own category, filtering on the
# catalog site stops being useful.
#
# Add a value only in a PR that also updates every place that reads this
# file: scripts/validate.py (via new_lab.py's CATEGORY_DIRS map) and
# web/src/lib/types.ts (CATEGORIES, kept byte-identical).

categories:
  - "SQL / NoSQL Injection"
  - "Command Injection"
  - "XSS"
  - "SSRF"
  - "CSRF"
  - "XXE"
  - "SSTI"
  - "Access Control / IDOR"
  - "Auth"
  - "File Upload"
  - "Deserialization"
  - "Race Condition"
  - "Business Logic"
  - "API / GraphQL"
  - "Cache Poisoning"
  - "Request Smuggling"
  - "Prototype Pollution"
  - "Recon / OSINT"

difficulties:
  - "Easy"
  - "Medium"
  - "Hard"
